name: Integration checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  product-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Start MongoDB and Elasticsearch
        run: docker compose up -d --wait mongo elasticsearch
      - name: Run test suite with required integration services
        run: python -m pytest -q
        env:
          REQUIRE_INTEGRATION: "1"
      - name: Stop integration services
        if: always()
        run: docker compose down -v
