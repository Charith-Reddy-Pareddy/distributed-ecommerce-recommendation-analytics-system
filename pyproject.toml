[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-recommendation-analytics"
version = "0.1.0"
description = "Distributed e-commerce recommendation and analytics system"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "confluent-kafka>=2.13,<3.0",
    "pymongo>=4.13,<5.0",
    "elasticsearch[async]>=8.17,<9.0",
    "cassandra-driver>=3.29,<4.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0,<3.0",
    "pytest>=8,<10",
]

[project.scripts]
recommendation-api = "ecommerce_analytics.recommendation_api:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = ["integration: requires the local Docker Compose services"]
