services:
  postgres:
    image: postgres:16-alpine
    # Lets serving-optimizer read pre-aggregated query stats from
    # pg_stat_statements instead of tailing logs. Ships in the stock image.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # product-service's store -- variable-shape product documents fit
  # MongoDB better than a flat SQL row.
  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db
    ports:
      - "27017:27017"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # Full-text + geo-filtered product search. Security disabled for this
  # local demo; single-node, so the index sets number_of_replicas=0.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    # Bumped from 1024m: was sitting at ~99% under normal load.
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  # KRaft mode, no Zookeeper (phased out since Kafka 3.3+). INTERNAL
  # listener for containers, EXTERNAL for host tools on localhost:9094.
  kafka:
    image: apache/kafka:3.8.1
    environment:
      CLUSTER_ID: DLso0pJLS9yl95ZAEU-b_w
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_NUM_PARTITIONS: "3"
      # Single broker: internal topics default to replication factor 3,
      # which stalls the consumer-group coordinator forever. Pin to 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    ports:
      - "9094:9094"
    volumes:
      - kafkadata:/tmp/kraft-combined-logs
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # HDFS -- the batch layer's raw event store. Custom arm64 image
  # (infra/hadoop); the official Hadoop images are amd64-only.
  hdfs-namenode:
    build: ./infra/hadoop
    command: ["/entrypoint-namenode.sh"]
    environment:
      HDFS_NAMENODE_OPTS: -Xmx512m
    ports:
      - "9870:9870"
    volumes:
      - hdfs-namenode-data:/hadoop/dfs/name
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9870/ > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  hdfs-datanode:
    build: ./infra/hadoop
    command: ["/entrypoint-datanode.sh"]
    environment:
      HDFS_DATANODE_OPTS: -Xmx512m
    volumes:
      - hdfs-datanode-data:/hadoop/dfs/data
    mem_limit: 768m
    depends_on:
      hdfs-namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9864/ > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # Persistent consumer group, not a fresh one per restart -- this writes
  # an append-only HDFS archive, and replaying would duplicate batches.
  hdfs-sink:
    build: ./services/hdfs-sink
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WEBHDFS_URL: http://hdfs-namenode:9870
    mem_limit: 256m
    depends_on:
      kafka:
        condition: service_healthy
      hdfs-datanode:
        condition: service_healthy

  # One-shot job, kept out of `docker compose up` (profile "jobs").
  # Reuses the Hadoop image rather than duplicating the ~450MB download.
  mapreduce-product-popularity:
    build: ./infra/hadoop
    profiles: ["jobs"]
    command: ["/job/run_job.sh"]
    volumes:
      - ./jobs/product-popularity:/job

  # HBase's serving layer for low-latency ALS lookups, backed by real
  # HDFS storage, not standalone mode. Still needs ZooKeeper for master
  # election -- no KRaft-equivalent for HBase.
  zookeeper:
    image: zookeeper:3.9
    environment:
      # Recent ZooKeeper disables most 4lw commands by default; "ruok"
      # needs an explicit whitelist or the healthcheck fails forever.
      ZOO_4LW_COMMANDS_WHITELIST: ruok,srvr,stat
    ports:
      - "2181:2181"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep -q imok"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  hbase-master:
    build: ./infra/hbase
    command: ["/entrypoint-master.sh"]
    environment:
      HBASE_OPTS: -Xmx768m
    ports:
      - "16010:16010"  # web UI
    mem_limit: 1024m
    depends_on:
      zookeeper:
        condition: service_healthy
      hdfs-datanode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:16010/ > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  hbase-regionserver:
    build: ./infra/hbase
    command: ["/entrypoint-regionserver.sh"]
    environment:
      HBASE_OPTS: -Xmx1024m
    mem_limit: 1280m
    depends_on:
      hbase-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:16030/ > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # HBase's REST server (Stargate) -- lets recommendation-service query
  # HBase over plain HTTP instead of a JVM/Thrift client.
  hbase-rest:
    build: ./infra/hbase
    command: ["/entrypoint-rest.sh"]
    ports:
      - "8095:8080"
    mem_limit: 512m
    depends_on:
      hbase-regionserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/version > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # One-shot job: loads ALS recs from HDFS into HBase. Kept out of
  # `docker compose up` behind the "jobs" profile.
  hbase-load-recommendations:
    build: ./services/hbase-loader
    profiles: ["jobs"]
    environment:
      WEBHDFS_URL: http://hdfs-namenode:9870
      HBASE_REST_URL: http://hbase-rest:8080
    depends_on:
      hbase-rest:
        condition: service_healthy

  # Reuses the per-minute counts already computed for anomaly detection.
  # Partition-per-day is the standard time-series pattern here, vs.
  # Postgres' row-per-event style elsewhere in this project.
  cassandra:
    image: cassandra:5.0
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      CASSANDRA_CLUSTER_NAME: ecommerce-cluster
    ports:
      - "9042:9042"
    # Bumped from 1024m: was sitting at ~96% under normal load.
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # apache/spark publishes native arm64 builds, unlike the Hadoop images.
  spark-master:
    image: apache/spark:3.5.2-python3
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8090:8080"  # web UI (8080 avoided -- not otherwise used here, but
                      # kept off the common default to reduce collision risk)
      - "7077:7077"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  spark-worker:
    image: apache/spark:3.5.2-python3
    # pyspark.ml needs numpy, but executors run inside this container
    # (not the driver's), so it has to be installed here too, not just
    # wherever spark-submit runs. Installed to /tmp since there's no
    # home directory for pip's default install target.
    command:
      - /bin/bash
      - -c
      - >
        pip3 install --target=/tmp/pylibs numpy &&
        exec /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      # 4, not 2: an uncapped streaming job took both cores on a 2-core
      # worker and starved every batch job submitted after it.
      # spark-streaming is now explicitly capped (see below).
      SPARK_WORKER_CORES: "4"
      # 2g for normal operation; bump to 5g (with mem_limit) only if
      # rerunning ALS training, which needs more headroom alongside
      # streaming than day-to-day operation does.
      SPARK_WORKER_MEMORY: 2g
      PYTHONPATH: /tmp/pylibs
    mem_limit: 2500m
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/ > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # Long-running, so it's part of the default `docker compose up`, not
  # the "jobs" profile like the batch jobs.
  spark-streaming:
    image: apache/spark:3.5.2-python3
    # Ivy cache lives under /tmp, not a named volume or ~/.ivy2 -- this
    # image's "spark" user has no home directory, and /tmp is the only
    # writable option. Connector jars re-download on every restart as a
    # result, fine for a demo. cassandra-driver is installed the same way.
    command:
      - /bin/bash
      - -c
      - >
        mkdir -p /tmp/.ivy2/cache /tmp/.ivy2/jars &&
        pip3 install --target=/tmp/pylibs cassandra-driver &&
        PYTHONPATH=/tmp/pylibs:/job exec /opt/spark/bin/spark-submit
        --master spark://spark-master:7077
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.2
        --conf spark.jars.ivy=/tmp/.ivy2
        --conf spark.cores.max=2
        --conf spark.executorEnv.PYTHONPATH=/tmp/pylibs
        --py-files /job/cassandra_writer.py
        /job/session_and_anomaly.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      HDFS_URI: hdfs://hdfs-namenode:9000
      CASSANDRA_HOST: cassandra
      # SESSION_GAP/SESSION_WATERMARK omitted -- the job's own realistic
      # defaults apply unless overridden for faster local testing.
    volumes:
      - ./jobs/spark-streaming:/job
    # Bumped from 768m: batches were taking 30-40s against a 30s trigger.
    mem_limit: 1280m
    depends_on:
      spark-worker:
        condition: service_healthy
      kafka:
        condition: service_healthy
      hdfs-datanode:
        condition: service_healthy
      cassandra:
        condition: service_healthy

  # One-shot, kept behind the "jobs" profile like the MapReduce job.
  # Trains ALS on the RetailRocket dataset already loaded into HDFS.
  als-training:
    image: apache/spark:3.5.2-python3
    profiles: ["jobs"]
    # No Kafka here, so just numpy -- same /tmp workaround as spark-worker.
    command:
      - /bin/bash
      - -c
      - >
        pip3 install --target=/tmp/pylibs numpy &&
        exec /opt/spark/bin/spark-submit
        --master spark://spark-master:7077
        --driver-memory 1g
        --executor-memory 2500m
        --conf spark.executorEnv.PYTHONPATH=/tmp/pylibs
        --conf spark.cores.max=2
        /job/train_als.py
    environment:
      HDFS_URI: hdfs://hdfs-namenode:9000
      PYTHONPATH: /tmp/pylibs
    volumes:
      - ./jobs/als-training:/job
    depends_on:
      spark-worker:
        condition: service_healthy
      hdfs-datanode:
        condition: service_healthy

  product-service:
    build: ./services/product-service
    environment:
      MONGODB_URL: mongodb://mongo:27017
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "8001:8000"
    mem_limit: 384m
    depends_on:
      mongo:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  user-service:
    build: ./services/user-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/user_db
    ports:
      - "8002:8000"
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy

  event-service:
    build: ./services/event-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8003:8000"
    mem_limit: 384m
    depends_on:
      kafka:
        condition: service_healthy

  recommendation-service:
    build: ./services/recommendation-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PRODUCT_SERVICE_URL: http://product-service:8000
      HBASE_REST_URL: http://hbase-rest:8080
    ports:
      - "8004:8000"
    # A bit more than the other services: holds the similarity model in memory.
    mem_limit: 512m
    depends_on:
      kafka:
        condition: service_healthy
      event-service:
        condition: service_started
      hbase-rest:
        condition: service_healthy

  analytics-service:
    build: ./services/analytics-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/analytics_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CASSANDRA_HOST: cassandra
    ports:
      - "8005:8000"
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      event-service:
        condition: service_started
      cassandra:
        condition: service_healthy

  # Watches real Postgres/Cassandra/Elasticsearch usage and acts on it --
  # creates/drops indexes, classifies hot/cold products, tunes
  # refresh_interval. Inspired by nimit-pasricha/auto-indexing, extended
  # to three stores (see README). Polls existing data independently, so
  # a bug here can't affect any other service.
  serving-optimizer:
    build: ./services/serving-optimizer
    environment:
      PG_HOST: postgres
      PG_TARGET_DBS: user_db,analytics_db
      CASSANDRA_HOST: cassandra
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "8007:8000"
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  # Thin server-side proxy tying the serving-layer pieces together -- the
  # browser only talks to Flask, never the backend services directly.
  dashboard:
    build: ./services/dashboard
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8000
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8000
      ANALYTICS_SERVICE_URL: http://analytics-service:8000
      SERVING_OPTIMIZER_URL: http://serving-optimizer:8000
    ports:
      - "8006:8000"
    mem_limit: 256m
    depends_on:
      product-service:
        condition: service_started
      recommendation-service:
        condition: service_started
      analytics-service:
        condition: service_started
      serving-optimizer:
        condition: service_started

volumes:
  pgdata:
  mongodata:
  kafkadata:
  hdfs-namenode-data:
  hdfs-datanode-data:
