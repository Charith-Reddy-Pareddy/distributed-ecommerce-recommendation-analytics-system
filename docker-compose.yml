services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka in KRaft mode -- no separate Zookeeper container. Zookeeper is being
  # phased out of Kafka itself (KRaft has been the recommended mode since
  # Kafka 3.3+); skipping it also saves real memory in our resource budget.
  # Uses the official apache/kafka image (published by the Kafka project
  # itself since 3.7) rather than a third-party distribution.
  # Two listeners: INTERNAL for other containers, EXTERNAL for host tools
  # (e.g. the load-test script) connecting via localhost:9094.
  kafka:
    image: apache/kafka:3.8.1
    environment:
      CLUSTER_ID: DLso0pJLS9yl95ZAEU-b_w
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_NUM_PARTITIONS: "3"
      # Single-broker cluster: internal topics default to replication
      # factor 3, which can never be satisfied with one broker -- that
      # silently stalls the consumer-group coordinator (every consumer
      # hangs forever with no partitions assigned). Pin them to 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    ports:
      - "9094:9094"
    volumes:
      - kafkadata:/tmp/kraft-combined-logs
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # HDFS -- the batch layer's raw event store. Built from a custom image
  # (infra/hadoop) rather than a stock Hadoop image: both apache/hadoop and
  # the popular bde2020/hadoop-* images are amd64-only, which means Rosetta
  # emulation on Apple Silicon. Hadoop's JARs are architecture-neutral, so
  # building on a native-arm64 JDK base avoids emulation entirely.
  hdfs-namenode:
    build: ./infra/hadoop
    command: ["/entrypoint-namenode.sh"]
    environment:
      HDFS_NAMENODE_OPTS: -Xmx512m
    ports:
      - "9870:9870"
    volumes:
      - hdfs-namenode-data:/hadoop/dfs/name
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9870/ > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  hdfs-datanode:
    build: ./infra/hadoop
    command: ["/entrypoint-datanode.sh"]
    environment:
      HDFS_DATANODE_OPTS: -Xmx512m
    volumes:
      - hdfs-datanode-data:/hadoop/dfs/data
    mem_limit: 768m
    depends_on:
      hdfs-namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9864/ > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # Consumes the same Kafka `events` topic as recommendation-service and
  # analytics-service, but with a persistent (committed-offset) consumer
  # group -- unlike those two, this one must NOT replay from the beginning
  # on every restart, since it's writing an append-only archive to HDFS and
  # replaying would duplicate every batch already written.
  hdfs-sink:
    build: ./services/hdfs-sink
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WEBHDFS_URL: http://hdfs-namenode:9870
    depends_on:
      kafka:
        condition: service_healthy
      hdfs-datanode:
        condition: service_healthy

  # A batch job, not a service -- it runs once and exits, so it's kept out
  # of `docker compose up` (profile "jobs") and invoked on demand with
  # `docker compose --profile jobs run --rm mapreduce-product-popularity`.
  # Reuses the hdfs-namenode/datanode image (same Hadoop install, same
  # client tools) rather than duplicating the ~450MB Hadoop download in a
  # separate image; the actual job code is mounted in as a volume.
  mapreduce-product-popularity:
    build: ./infra/hadoop
    profiles: ["jobs"]
    command: ["/job/run_job.sh"]
    volumes:
      - ./jobs/product-popularity:/job

  # HBase's serving layer -- low-latency point lookups for the ALS
  # recommendations precomputed in HDFS, and (eventually) any other
  # user-item data that benefits from key-value access instead of a
  # full Spark job. Storage is real HDFS (hbase.rootdir points at the
  # namenode above), not HBase's local-disk standalone mode.
  #
  # HBase still requires ZooKeeper for master election / region
  # coordination -- unlike Kafka, there's no KRaft-equivalent for it.
  # The official zookeeper image does publish native arm64 builds.
  zookeeper:
    image: zookeeper:3.9
    environment:
      # Recent ZooKeeper versions disable most 4-letter-word admin
      # commands by default for security -- only "srvr" is enabled out
      # of the box, so a healthcheck relying on the classic "ruok" probe
      # silently fails forever unless it's explicitly whitelisted.
      ZOO_4LW_COMMANDS_WHITELIST: ruok,srvr,stat
    ports:
      - "2181:2181"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep -q imok"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  hbase-master:
    build: ./infra/hbase
    command: ["/entrypoint-master.sh"]
    environment:
      HBASE_OPTS: -Xmx768m
    ports:
      - "16010:16010"  # web UI
    mem_limit: 1024m
    depends_on:
      zookeeper:
        condition: service_healthy
      hdfs-datanode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:16010/ > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  hbase-regionserver:
    build: ./infra/hbase
    command: ["/entrypoint-regionserver.sh"]
    environment:
      HBASE_OPTS: -Xmx1024m
    mem_limit: 1280m
    depends_on:
      hbase-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:16030/ > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # HTTP interface onto HBase (the "Stargate" REST server bundled with
  # HBase itself) -- lets recommendation-service query HBase over plain
  # HTTP instead of needing a JVM/Thrift client from a Python service.
  hbase-rest:
    build: ./infra/hbase
    command: ["/entrypoint-rest.sh"]
    ports:
      - "8095:8080"
    mem_limit: 512m
    depends_on:
      hbase-regionserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/version > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # One-shot job -- loads the ALS recommendations already computed and
  # sitting in HDFS (see als-training above) into HBase for low-latency
  # point lookups. Kept out of `docker compose up` behind the "jobs"
  # profile, same as the other batch jobs.
  hbase-load-recommendations:
    build: ./services/hbase-loader
    profiles: ["jobs"]
    environment:
      WEBHDFS_URL: http://hdfs-namenode:9870
      HBASE_REST_URL: http://hbase-rest:8080
    depends_on:
      hbase-rest:
        condition: service_healthy

  # Time-series demand store. The Spark Structured Streaming job (below)
  # writes the same per-product, per-minute window counts it already
  # computes for Z-score anomaly detection into here too -- one
  # computation, two consumers. Cassandra's partition-per-day design
  # (see the schema the job creates) is the standard pattern for
  # high-write-throughput time-series data, as opposed to Postgres'
  # row-per-event style used elsewhere in this project.
  cassandra:
    image: cassandra:5.0
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      CASSANDRA_CLUSTER_NAME: ecommerce-cluster
    ports:
      - "9042:9042"
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # Spark standalone cluster (the speed layer's compute engine) -- the
  # official apache/spark image supports native arm64, unlike the Hadoop
  # images, so no custom build needed here.
  spark-master:
    image: apache/spark:3.5.2-python3
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8090:8080"  # web UI (8080 avoided -- not otherwise used here, but
                      # kept off the common default to reduce collision risk)
      - "7077:7077"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  spark-worker:
    image: apache/spark:3.5.2-python3
    # numpy isn't bundled in this image, but pyspark.ml (used by the ALS
    # training job) requires it -- and since Standalone-mode executors run
    # as child processes of this container's Worker JVM (not inside the
    # driver's own container), numpy has to be installed *here*, not just
    # wherever spark-submit runs. Installed to /tmp (not the nonexistent
    # home directory) and put on PYTHONPATH so spawned executor processes,
    # which inherit their parent's environment, can import it too.
    command:
      - /bin/bash
      - -c
      - >
        pip3 install --target=/tmp/pylibs numpy &&
        exec /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      # 4, not 2: Spark Standalone gives an application ALL available
      # worker cores by default unless it caps itself with
      # spark.cores.max. The always-on spark-streaming job grabbed both
      # cores on a 2-core worker and never released them, permanently
      # starving any batch job (als-training, and eventually the
      # MapReduce-adjacent jobs) submitted afterward -- discovered when
      # als-training sat in Spark's WAITING state indefinitely. Now
      # spark-streaming is explicitly capped (see below) so batch jobs
      # always have cores left to run on.
      SPARK_WORKER_CORES: "4"
      # 2g for everyday operation (streaming only needs ~1g). The one-shot
      # als-training job needed 5g (its 2.5g executor plus streaming's
      # permanent 1g left too little free memory for both to run at once
      # -- Spark Standalone needs cores AND memory free simultaneously,
      # discovered when als-training sat WAITING despite having free
      # cores). That was a temporary bump for that specific job, not a
      # standing requirement -- as more memory-hungry services (Cassandra,
      # MongoDB, Elasticsearch) join the default `docker compose up`
      # footprint, keeping this at its actual day-to-day need matters more
      # than it did early on. Bump back to 5g (SPARK_WORKER_MEMORY and
      # mem_limit both) if you need to rerun ALS training.
      SPARK_WORKER_MEMORY: 2g
      PYTHONPATH: /tmp/pylibs
    mem_limit: 2500m
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/ > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # The speed layer itself: a long-running Structured Streaming job (not a
  # one-shot batch job like the MapReduce popularity job), so it's part of
  # the default `docker compose up`, not the "jobs" profile.
  spark-streaming:
    image: apache/spark:3.5.2-python3
    # Ivy's package cache lives in plain container storage under /tmp (not a
    # named volume, and not Ivy's default ~/.ivy2 -- this image's "spark"
    # user has no home directory at all). /tmp is world-writable by
    # default, whereas a named volume mounted there would be created
    # root-owned and unwritable by the non-root "spark" user this image
    # runs as. Trade-off: the ~20MB Kafka connector jars re-download on
    # every container restart rather than being cached -- fine for a demo.
    # Ivy also doesn't reliably create its own cache/jars subdirectories,
    # so they're created explicitly first. Also installs cassandra-driver
    # to the same ephemeral /tmp location as numpy elsewhere in this
    # project (this image's "spark" user has no home directory, so pip's
    # default install target isn't writable). Command (not entrypoint) is
    # overridden so the image's own /opt/entrypoint.sh still runs first
    # (JAVA_HOME/classpath setup) and passes this through via its
    # pass-through case.
    command:
      - /bin/bash
      - -c
      - >
        mkdir -p /tmp/.ivy2/cache /tmp/.ivy2/jars &&
        pip3 install --target=/tmp/pylibs cassandra-driver &&
        PYTHONPATH=/tmp/pylibs:/job exec /opt/spark/bin/spark-submit
        --master spark://spark-master:7077
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.2
        --conf spark.jars.ivy=/tmp/.ivy2
        --conf spark.cores.max=2
        --conf spark.executorEnv.PYTHONPATH=/tmp/pylibs
        --py-files /job/cassandra_writer.py
        /job/session_and_anomaly.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      HDFS_URI: hdfs://hdfs-namenode:9000
      CASSANDRA_HOST: cassandra
      # SESSION_GAP/SESSION_WATERMARK intentionally omitted here -- the
      # job's own defaults (5 minutes / 10 minutes, realistic session
      # semantics) apply. Override with shorter values only for fast
      # local verification, e.g.: SESSION_GAP="30 seconds" SESSION_WATERMARK="1 minute"
    volumes:
      - ./jobs/spark-streaming:/job
    mem_limit: 768m
    depends_on:
      spark-worker:
        condition: service_healthy
      kafka:
        condition: service_healthy
      hdfs-datanode:
        condition: service_healthy
      cassandra:
        condition: service_healthy

  # Batch job (train-once, not a daemon) -- kept out of `docker compose up`
  # behind the "jobs" profile, same as mapreduce-product-popularity.
  # Trains ALS on the RetailRocket dataset already loaded into HDFS.
  als-training:
    image: apache/spark:3.5.2-python3
    profiles: ["jobs"]
    # No Kafka involved here (reads straight from HDFS), so no --packages
    # / Ivy cache needed -- just numpy for the driver side of pyspark.ml,
    # same reasoning and same /tmp workaround as spark-worker above.
    command:
      - /bin/bash
      - -c
      - >
        pip3 install --target=/tmp/pylibs numpy &&
        exec /opt/spark/bin/spark-submit
        --master spark://spark-master:7077
        --driver-memory 1g
        --executor-memory 2500m
        --conf spark.executorEnv.PYTHONPATH=/tmp/pylibs
        --conf spark.cores.max=2
        /job/train_als.py
    environment:
      HDFS_URI: hdfs://hdfs-namenode:9000
      PYTHONPATH: /tmp/pylibs
    volumes:
      - ./jobs/als-training:/job
    depends_on:
      spark-worker:
        condition: service_healthy
      hdfs-datanode:
        condition: service_healthy

  product-service:
    build: ./services/product-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/product_db
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build: ./services/user-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/user_db
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy

  event-service:
    build: ./services/event-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8003:8000"
    depends_on:
      kafka:
        condition: service_healthy

  recommendation-service:
    build: ./services/recommendation-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PRODUCT_SERVICE_URL: http://product-service:8000
      HBASE_REST_URL: http://hbase-rest:8080
    ports:
      - "8004:8000"
    depends_on:
      kafka:
        condition: service_healthy
      event-service:
        condition: service_started
      hbase-rest:
        condition: service_healthy

  analytics-service:
    build: ./services/analytics-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/analytics_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CASSANDRA_HOST: cassandra
    ports:
      - "8005:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      event-service:
        condition: service_started
      cassandra:
        condition: service_healthy

volumes:
  pgdata:
  kafkadata:
  hdfs-namenode-data:
  hdfs-datanode-data:
