services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka in KRaft mode -- no separate Zookeeper container. Zookeeper is being
  # phased out of Kafka itself (KRaft has been the recommended mode since
  # Kafka 3.3+); skipping it also saves real memory in our resource budget.
  # Uses the official apache/kafka image (published by the Kafka project
  # itself since 3.7) rather than a third-party distribution.
  # Two listeners: INTERNAL for other containers, EXTERNAL for host tools
  # (e.g. the load-test script) connecting via localhost:9094.
  kafka:
    image: apache/kafka:3.8.1
    environment:
      CLUSTER_ID: DLso0pJLS9yl95ZAEU-b_w
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_NUM_PARTITIONS: "3"
      # Single-broker cluster: internal topics default to replication
      # factor 3, which can never be satisfied with one broker -- that
      # silently stalls the consumer-group coordinator (every consumer
      # hangs forever with no partitions assigned). Pin them to 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    ports:
      - "9094:9094"
    volumes:
      - kafkadata:/tmp/kraft-combined-logs
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # HDFS -- the batch layer's raw event store. Built from a custom image
  # (infra/hadoop) rather than a stock Hadoop image: both apache/hadoop and
  # the popular bde2020/hadoop-* images are amd64-only, which means Rosetta
  # emulation on Apple Silicon. Hadoop's JARs are architecture-neutral, so
  # building on a native-arm64 JDK base avoids emulation entirely.
  hdfs-namenode:
    build: ./infra/hadoop
    command: ["/entrypoint-namenode.sh"]
    environment:
      HDFS_NAMENODE_OPTS: -Xmx512m
    ports:
      - "9870:9870"
    volumes:
      - hdfs-namenode-data:/hadoop/dfs/name
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9870/ > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  hdfs-datanode:
    build: ./infra/hadoop
    command: ["/entrypoint-datanode.sh"]
    environment:
      HDFS_DATANODE_OPTS: -Xmx512m
    volumes:
      - hdfs-datanode-data:/hadoop/dfs/data
    mem_limit: 768m
    depends_on:
      hdfs-namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9864/ > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # Consumes the same Kafka `events` topic as recommendation-service and
  # analytics-service, but with a persistent (committed-offset) consumer
  # group -- unlike those two, this one must NOT replay from the beginning
  # on every restart, since it's writing an append-only archive to HDFS and
  # replaying would duplicate every batch already written.
  hdfs-sink:
    build: ./services/hdfs-sink
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WEBHDFS_URL: http://hdfs-namenode:9870
    depends_on:
      kafka:
        condition: service_healthy
      hdfs-datanode:
        condition: service_healthy

  product-service:
    build: ./services/product-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/product_db
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build: ./services/user-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/user_db
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy

  event-service:
    build: ./services/event-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8003:8000"
    depends_on:
      kafka:
        condition: service_healthy

  recommendation-service:
    build: ./services/recommendation-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PRODUCT_SERVICE_URL: http://product-service:8000
    ports:
      - "8004:8000"
    depends_on:
      kafka:
        condition: service_healthy
      event-service:
        condition: service_started

  analytics-service:
    build: ./services/analytics-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/analytics_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8005:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      event-service:
        condition: service_started

volumes:
  pgdata:
  kafkadata:
  hdfs-namenode-data:
  hdfs-datanode-data:
